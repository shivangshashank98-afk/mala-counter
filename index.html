<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mala Counter</title>
<meta name="theme-color" content="#16110d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#16110d;
    --bg-vignette:#0d0a06;
    --surface:#1f1811;
    --surface-2:#271e14;
    --copper:#c9853f;
    --copper-bright:#e8a33d;
    --copper-glow:#ffd28a;
    --rudraksha:#3d2e1e;
    --rudraksha-dim:#2a2015;
    --ivory:#f3e9d8;
    --sandal:#a9906f;
    --sandal-dim:#6e5c44;
    --line:#332818;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Work Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 120% 60% at 50% 8%, #2a1f13 0%, transparent 60%),
      radial-gradient(ellipse 140% 80% at 50% 100%, #1b140d 0%, var(--bg-vignette) 70%);
    background-color:var(--bg-deep);
    color:var(--ivory);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 8px;
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{width:26px; height:26px;}
  .brand span{font-family:var(--font-display); font-size:19px; font-weight:500; letter-spacing:0.3px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--sandal); cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-2);}
  .icon-btn svg{width:18px; height:18px;}

  /* ---------- Main stage ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    gap:10px;
    padding:0 20px;
    min-height:0;
  }

  .ring-wrap{
    position:relative;
    width:min(76vw, 300px);
    height:min(76vw, 300px);
    display:flex; align-items:center; justify-content:center;
  }
  .ring-ambient{
    position:absolute; inset:-14%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,163,61,0.16) 0%, rgba(232,163,61,0) 68%);
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .ring{
    position:absolute; inset:0;
    transition:transform 480ms cubic-bezier(.22,1.44,.36,1);
    will-change:transform;
  }
  .bead{
    position:absolute;
    width:15px; height:15px;
    top:50%; left:50%;
    margin:-7.5px 0 0 -7.5px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, var(--rudraksha-dim), var(--rudraksha) 70%, #180f08 100%);
    box-shadow: inset -1.5px -2px 3px rgba(0,0,0,.55), 0 1px 1px rgba(0,0,0,.4);
    transition:background 320ms ease, box-shadow 320ms ease, transform 320ms cubic-bezier(.34,1.56,.64,1);
  }
  .bead.counted{
    background:radial-gradient(circle at 34% 30%, var(--copper-glow), var(--copper) 55%, #6b4620 100%);
    box-shadow: inset -1.5px -2px 3px rgba(0,0,0,.35), 0 0 6px rgba(232,163,61,0.55);
  }
  .bead.guru{
    width:22px; height:22px; margin:-11px 0 0 -11px;
    background:radial-gradient(circle at 34% 30%, #fff1d0, var(--copper-bright) 55%, #7a4f22 100%);
    box-shadow: inset -2px -3px 4px rgba(0,0,0,.4), 0 0 10px rgba(232,163,61,0.5);
  }
  .bead.pulse{ transform:scale(1.55); }

  .gate{
    position:absolute; top:-4px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    z-index:5;
    pointer-events:none;
  }
  .gate::after{
    content:'';
    position:absolute; left:50%; top:6px; transform:translateX(-50%);
    width:3px; height:16px; border-radius:2px;
    background:var(--copper-glow);
    box-shadow:0 0 6px var(--copper-bright);
    opacity:0.85;
  }
  .gate.flash::after{ animation:gateFlash 380ms ease-out; }
  @keyframes gateFlash{
    0%{ opacity:1; height:24px; box-shadow:0 0 16px 4px var(--copper-bright);}
    100%{ opacity:0.85; height:16px; box-shadow:0 0 6px var(--copper-bright);}
  }

  .center-readout{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none;
  }
  .count-num{
    font-family:var(--font-display);
    font-variant-numeric:tabular-nums;
    font-size:64px; font-weight:500; line-height:1;
    color:var(--ivory);
    text-shadow:0 0 24px rgba(232,163,61,0.18);
  }
  .count-den{
    font-family:var(--font-body);
    font-size:13px; letter-spacing:2px;
    color:var(--sandal); margin-top:4px;
  }
  .complete-msg{
    margin-top:8px; font-size:12.5px; color:var(--copper-bright);
    text-align:center; max-width:190px; line-height:1.4;
    opacity:0; transition:opacity .3s ease; font-weight:500;
  }
  .complete-msg.show{opacity:1;}

  .today-line{
    font-size:13px; color:var(--sandal); letter-spacing:0.3px;
  }
  .today-line b{color:var(--ivory); font-weight:600;}

  /* ---------- Focused Mode panel ---------- */
  .focus-card{
    width:100%; max-width:360px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));
    margin:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    flex-shrink:0;
  }
  .focus-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .focus-title{
    font-family:var(--font-display); font-size:15.5px; font-weight:500;
    display:flex; align-items:center; gap:7px;
  }
  .focus-title .dot{
    width:7px; height:7px; border-radius:50%; background:var(--sandal-dim);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .focus-title .dot.live{ background:var(--copper-bright); box-shadow:0 0 6px var(--copper-bright); animation:dotPulse 1.4s ease-in-out infinite;}
  @keyframes dotPulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .interval-row{ display:flex; gap:8px; margin-bottom:14px; }
  .chip{
    flex:1; text-align:center; padding:8px 0;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; font-size:12.5px; color:var(--sandal);
    cursor:pointer; transition:all .15s ease;
  }
  .chip.active{ background:rgba(232,163,61,0.14); border-color:var(--copper); color:var(--copper-bright); font-weight:600; }

  .focus-btn{
    width:100%; padding:13px 0; border-radius:12px; border:none;
    font-family:var(--font-body); font-size:14.5px; font-weight:600; letter-spacing:0.2px;
    cursor:pointer; transition:transform .12s ease, background .2s ease;
    background:linear-gradient(180deg, var(--copper-bright), var(--copper));
    color:#1a1206;
  }
  .focus-btn:active{ transform:scale(0.98); }
  .focus-btn.pause{ background:var(--surface-2); color:var(--ivory); border:1px solid var(--line); }
  .focus-btn.restart{ background:linear-gradient(180deg, #ffcf82, var(--copper-bright)); }

  .focus-state{
    text-align:center; font-size:12px; color:var(--sandal-dim);
    margin-top:9px; min-height:15px;
  }

  /* ---------- History overlay ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,7,4,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:flex-end;
    z-index:20; opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; background:var(--surface);
    border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:none;
    padding:20px 22px calc(28px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet h3{
    font-family:var(--font-display); font-weight:500; font-size:18px; margin:0 0 16px;
  }
  .bars{ display:flex; align-items:flex-end; gap:10px; height:120px; margin-bottom:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
  .bar{ width:100%; max-width:26px; border-radius:5px 5px 3px 3px; background:linear-gradient(180deg, var(--copper-bright), var(--copper)); min-height:3px; }
  .bar-label{ font-size:10.5px; color:var(--sandal-dim); }
  .bar-val{ font-size:10px; color:var(--sandal); }
  .reset-row{ margin-top:14px; text-align:center; }
  .reset-btn{
    background:none; border:1px solid var(--line); color:var(--sandal-dim);
    font-family:var(--font-body); font-size:12px; padding:8px 14px; border-radius:9px; cursor:pointer;
  }
  .reset-btn.confirm{ color:#e07a5f; border-color:#e07a5f; }
  .close-sheet{ display:block; margin:16px auto 0; background:none; border:none; color:var(--sandal-dim); font-size:13px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1f1811"/><path d="M 20 60 C 20 40 35 25 50 25 C 63 25 73 36 73 48 C 73 58 65 66 55 66 C 47 66 41 60 41 52 C 41 46 45 42 51 42 C 56 42 59 45 59 49" fill="none" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/><path d="M 20 60 C 12 66 9 76 18 82 C 26 88 36 82 37 72" fill="none" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/><circle cx="68" cy="24" r="4.5" fill="#e8a33d"/><path d="M 55 22 C 60 16 68 17 70 24" fill="none" stroke="#e8a33d" stroke-width="4" stroke-linecap="round"/></svg>
    <span>Mala</span>
  </div>
  <button class="icon-btn" id="historyBtn" aria-label="History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
  </button>
</header>

<main>
  <div class="ring-wrap" id="ringWrap">
    <div class="ring-ambient" id="ambient"></div>
    <div class="ring" id="ring"></div>
    <div class="gate" id="gate"></div>
    <div class="center-readout">
      <div class="count-num" id="countNum">0</div>
      <div class="count-den">OF 108</div>
      <div class="complete-msg" id="completeMsg">🙏 Round complete — press Start below to begin again</div>
    </div>
  </div>

  <div class="today-line">Today · <b id="todayTotal">0</b> beads</div>

  <div class="focus-card">
    <div class="focus-head">
      <div class="focus-title"><span class="dot" id="focusDot"></span>Focused Mode</div>
    </div>
    <div class="interval-row" id="intervalRow">
      <div class="chip" data-sec="1.5">1.5s</div>
      <div class="chip active" data-sec="2">2s</div>
      <div class="chip" data-sec="3">3s</div>
      <div class="chip" data-sec="5">5s</div>
    </div>
    <button class="focus-btn" id="focusBtn">Start</button>
    <div class="focus-state" id="focusState">Tap a bead, or start auto-counting</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>Last 7 days</h3>
    <div class="bars" id="bars"></div>
    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Reset today's count</button>
    </div>
    <button class="close-sheet" id="closeSheet">Close</button>
  </div>
</div>

<script>
(function(){
  const TOTAL_BEADS = 108;
  const RADIUS = 128; // px, matches ring-wrap ~300px
  const STORAGE_KEY = "mala_v2_state";
  const HISTORY_KEY = "mala_v2_history";

  const ring = document.getElementById('ring');
  const gate = document.getElementById('gate');
  const ambient = document.getElementById('ambient');
  const countNum = document.getElementById('countNum');
  const completeMsg = document.getElementById('completeMsg');
  const todayTotalEl = document.getElementById('todayTotal');
  const ringWrap = document.getElementById('ringWrap');
  const focusBtn = document.getElementById('focusBtn');
  const focusState = document.getElementById('focusState');
  const focusDot = document.getElementById('focusDot');
  const intervalRow = document.getElementById('intervalRow');
  const historyBtn = document.getElementById('historyBtn');
  const overlay = document.getElementById('overlay');
  const closeSheet = document.getElementById('closeSheet');
  const barsEl = document.getElementById('bars');
  const resetBtn = document.getElementById('resetBtn');

  function todayKey(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
  }

  let state = loadState();
  let history = loadHistory();
  let focusTimer = null;
  let focusRunning = false;
  let intervalSec = state.intervalSec || 2;

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { count:0, intervalSec:2 };
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {};
  }
  function saveHistory(){
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }
  function addToToday(n){
    const k = todayKey();
    history[k] = (history[k]||0) + n;
    saveHistory();
    renderToday();
  }
  function renderToday(){
    todayTotalEl.textContent = history[todayKey()] || 0;
  }

  // ---------- Bead ring build ----------
  const beadEls = [];
  for(let i=0;i<TOTAL_BEADS;i++){
    const angle = (i/TOTAL_BEADS) * 360;
    const b = document.createElement('div');
    b.className = 'bead';
    b.style.transform = `rotate(${angle}deg) translateY(-${RADIUS}px)`;
    ring.appendChild(b);
    beadEls.push(b);
  }
  const guru = document.createElement('div');
  guru.className = 'bead guru';
  guru.style.transform = `rotate(0deg) translateY(-${RADIUS}px)`;
  ring.appendChild(guru);

  function renderBeads(){
    for(let i=0;i<TOTAL_BEADS;i++){
      beadEls[i].classList.toggle('counted', i < state.count);
    }
  }

  function applyRotation(animate){
    const deg = -(state.count * (360/TOTAL_BEADS));
    ring.style.transition = animate ? '' : 'none';
    ring.style.transform = `rotate(${deg}deg)`;
    if(!animate){
      // force reflow then restore transition
      void ring.offsetHeight;
      ring.style.transition = '';
    }
  }

  function flashGate(){
    gate.classList.remove('flash');
    void gate.offsetWidth;
    gate.classList.add('flash');
  }
  function pulseBead(idx){
    if(idx<0) return;
    const el = beadEls[idx];
    el.classList.add('pulse');
    setTimeout(()=>el.classList.remove('pulse'), 320);
  }

  // ---------- Sound ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBeep(){
    try{
      ensureAudio();
      const t0 = audioCtx.currentTime;

      // low body tone with upward pitch bend
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(92, t0);
      osc.frequency.exponentialRampToValueAtTime(148, t0 + 0.11);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);

      // soft click transient for tactile attack
      const click = audioCtx.createOscillator();
      click.type = 'triangle';
      click.frequency.setValueAtTime(260, t0);
      const clickGain = audioCtx.createGain();
      clickGain.gain.setValueAtTime(0.12, t0);
      clickGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
      click.connect(clickGain);
      clickGain.connect(audioCtx.destination);
      click.start(t0);
      click.stop(t0 + 0.05);
    }catch(e){}
  }
  function playComplete(){
    try{
      ensureAudio();
      const t0 = audioCtx.currentTime;
      [0,0.14,0.28].forEach((off,i)=>{
        const osc = audioCtx.createOscillator();
        osc.type='sine';
        const base = 130 + i*40;
        osc.frequency.setValueAtTime(base, t0+off);
        osc.frequency.exponentialRampToValueAtTime(base*1.5, t0+off+0.16);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t0+off);
        g.gain.exponentialRampToValueAtTime(0.35, t0+off+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+off+0.35);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t0+off); osc.stop(t0+off+0.4);
      });
    }catch(e){}
  }

  // ---------- Core counting ----------
  function isComplete(){ return state.count >= TOTAL_BEADS; }

  function count(){
    if(isComplete()) return;
    state.count++;
    saveState();
    addToToday(1);
    applyRotation(true);
    renderBeads();
    countNum.textContent = state.count;
    flashGate();
    pulseBead(state.count-1);
    playBeep();
    if(navigator.vibrate) navigator.vibrate(14);

    if(isComplete()){
      onRoundComplete();
    }
  }

  function onRoundComplete(){
    completeMsg.classList.add('show');
    ambient.style.opacity = '1.6';
    playComplete();
    if(navigator.vibrate) navigator.vibrate([20,40,20,40,60]);
    stopFocus(true);
    focusBtn.textContent = 'Start New Round';
    focusBtn.classList.add('restart');
    focusState.textContent = 'Mala complete for this round 🙏';
  }

  function startNewRound(){
    state.count = 0;
    saveState();
    applyRotation(false);
    renderBeads();
    countNum.textContent = '0';
    completeMsg.classList.remove('show');
    ambient.style.opacity = '';
    focusBtn.classList.remove('restart');
  }

  ringWrap.addEventListener('click', (e)=>{
    if(e.target.closest('.gate')) return;
    if(isComplete()) return;
    count();
  });

  // ---------- Focused mode ----------
  intervalRow.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    [...intervalRow.children].forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    intervalSec = parseFloat(chip.dataset.sec);
    state.intervalSec = intervalSec;
    saveState();
    if(focusRunning){ stopFocus(false); startFocus(); }
  });

  function startFocus(){
    if(isComplete()) return;
    focusRunning = true;
    focusDot.classList.add('live');
    focusBtn.textContent = 'Pause';
    focusBtn.classList.add('pause');
    focusState.textContent = 'Auto-counting every ' + intervalSec + 's';
    focusTimer = setInterval(()=>{
      count();
      if(isComplete()){ /* onRoundComplete handles stop */ }
    }, intervalSec*1000);
  }
  function stopFocus(silent){
    focusRunning = false;
    clearInterval(focusTimer);
    focusDot.classList.remove('live');
    focusBtn.classList.remove('pause');
    if(!silent){
      focusBtn.textContent = 'Start';
      focusState.textContent = 'Paused';
    }
  }

  focusBtn.addEventListener('click', ()=>{
    if(isComplete()){
      startNewRound();
      focusBtn.textContent = 'Start';
      focusState.textContent = 'Tap a bead, or start auto-counting';
      return;
    }
    if(focusRunning){ stopFocus(false); }
    else{ ensureAudio(); startFocus(); }
  });

  // ---------- History overlay ----------
  function dayLabel(offset){
    const d = new Date();
    d.setDate(d.getDate()-offset);
    return d.toLocaleDateString(undefined,{weekday:'short'});
  }
  function keyForOffset(offset){
    const d = new Date();
    d.setDate(d.getDate()-offset);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
  }
  function renderHistory(){
    barsEl.innerHTML = '';
    const vals = [];
    for(let i=6;i>=0;i--){ vals.push(history[keyForOffset(i)]||0); }
    const max = Math.max(...vals, 108);
    for(let i=6;i>=0;i--){
      const val = history[keyForOffset(i)]||0;
      const col = document.createElement('div');
      col.className = 'bar-col';
      const barVal = document.createElement('div');
      barVal.className='bar-val'; barVal.textContent = val;
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(3, (val/max)*100) + '%';
      const label = document.createElement('div');
      label.className='bar-label'; label.textContent = dayLabel(i);
      col.appendChild(barVal); col.appendChild(bar); col.appendChild(label);
      barsEl.appendChild(col);
    }
  }
  historyBtn.addEventListener('click', ()=>{ renderHistory(); overlay.classList.add('open'); });
  closeSheet.addEventListener('click', ()=> overlay.classList.remove('open'));
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); });

  let resetArmed = false;
  resetBtn.addEventListener('click', ()=>{
    if(!resetArmed){
      resetArmed = true;
      resetBtn.textContent = 'Tap again to confirm';
      resetBtn.classList.add('confirm');
      setTimeout(()=>{ resetArmed=false; resetBtn.textContent="Reset today's count"; resetBtn.classList.remove('confirm'); }, 2500);
      return;
    }
    history[todayKey()] = 0;
    saveHistory();
    renderToday();
    renderHistory();
    resetArmed = false;
    resetBtn.textContent = "Reset today's count";
    resetBtn.classList.remove('confirm');
  });

  // ---------- Init ----------
  (function init(){
    if(state.intervalSec){
      intervalSec = state.intervalSec;
      [...intervalRow.children].forEach(c=>{
        c.classList.toggle('active', parseFloat(c.dataset.sec) === intervalSec);
      });
    }
    renderBeads();
    applyRotation(false);
    countNum.textContent = state.count;
    renderToday();
    if(isComplete()){
      completeMsg.classList.add('show');
      focusBtn.textContent = 'Start New Round';
      focusBtn.classList.add('restart');
      focusState.textContent = 'Mala complete for this round 🙏';
    }
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
